name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Check formatting
        run: npm run format:check:delivery

      - name: Checkout service contract
        uses: actions/checkout@v4
        with:
          repository: liuyitimes/trading-toolkit-service
          path: service-contract-repository
          sparse-checkout: contracts/http-api.json

      - name: Verify service contract
        env:
          SERVICE_CONTRACT_PATH: service-contract-repository/contracts/http-api.json
        run: npm run verify:contract

      - name: Verify placement export
        run: npm run verify:placement-export

      - name: Build
        run: npm run build

      - name: Verify placement browser workflow
        run: |
          npm run dev -- --host 127.0.0.1 --port 5175 > /tmp/vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5175; then break; fi
            sleep 1
          done
          npm run verify:market-browser
          npm run verify:placement-browser
          npm run verify:lof-market-overview
